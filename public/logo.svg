<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mfs-core-grad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="mfs-orbit-grad" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="mfs-highlight" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="mfs-text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.75" stdDeviation="0.6" flood-color="#1e1b4b" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 3 tilted elliptical orbits -->
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(-30 32 32)" stroke="url(#mfs-orbit-grad)" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(30 32 32)" stroke="url(#mfs-orbit-grad)" stroke-width="2.5" stroke-linecap="round" />
  <ellipse cx="32" cy="32" rx="26" ry="11" transform="rotate(90 32 32)" stroke="url(#mfs-orbit-grad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Orbiting theme-palette nodes -->
  <circle cx="52" cy="20.5" r="2.75" fill="#06b6d4" />
  <circle cx="12" cy="43.5" r="2.75" fill="#6366f1" />
  <circle cx="32" cy="6" r="2.75" fill="#8b5cf6" />

  <!-- Central theme-core sphere -->
  <circle cx="32" cy="32" r="12" fill="url(#mfs-core-grad)" />
  <circle cx="32" cy="32" r="12" fill="url(#mfs-highlight)" />

  <!-- Centered MFS mark -->
  <text
    x="32"
    y="32.2"
    fill="#ffffff"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, -apple-system, sans-serif"
    font-size="7.5"
    font-weight="800"
    letter-spacing="0.3"
    filter="url(#mfs-text-shadow)"
  >MFS</text>
</svg>
